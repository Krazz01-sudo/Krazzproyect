<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Un detalle especial para ti</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Great+Vibes&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Montserrat', sans-serif;
      background: radial-gradient(circle at center, #1f0308 0%, #0a0103 100%);
      color: #fff;
    }

    /* Canvas para la lluvia de pétalos */
    #petals-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* Contenedor principal */
    .container {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* Pantalla inicial con la rosa */
    .intro-screen {
      text-align: center;
      transition: opacity 0.8s ease, transform 0.8s ease;
      cursor: pointer;
    }

    .intro-screen.hidden {
      opacity: 0;
      transform: scale(0.8);
      pointer-events: none;
      position: absolute;
    }

    .rose-container {
      position: relative;
      width: 140px;
      height: 140px;
      margin: 0 auto 25px auto;
      filter: drop-shadow(0 0 25px rgba(230, 29, 63, 0.6));
      animation: float 3s ease-in-out infinite;
    }

    .rose-svg {
      width: 100%;
      height: 100%;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    .click-hint {
      font-family: 'Caveat', cursive;
      font-size: 1.8rem;
      color: #ff9ebb;
      margin-top: 15px;
      letter-spacing: 1px;
      text-shadow: 0 0 10px rgba(255, 158, 187, 0.4);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    /* Tarjeta del mensaje */
    .card {
      background: rgba(25, 4, 10, 0.75);
      border: 1px solid rgba(230, 29, 63, 0.3);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 40px 30px;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 30px rgba(230, 29, 63, 0.25);
      opacity: 0;
      transform: scale(0.85) translateY(20px);
      transition: opacity 1s ease, transform 1s ease;
      position: absolute;
      pointer-events: none;
    }

    .card.visible {
      opacity: 1;
      transform: scale(1) translateY(0);
      pointer-events: auto;
    }

    .card-header {
      font-family: 'Great Vibes', cursive;
      font-size: 2.8rem;
      color: #ff4d6d;
      text-align: center;
      margin-bottom: 20px;
      text-shadow: 0 0 12px rgba(255, 77, 109, 0.4);
    }

    .card-body {
      font-size: 1rem;
      line-height: 1.8;
      color: #fce4ec;
      text-align: justify;
      font-weight: 300;
      margin-bottom: 25px;
    }

    .card-body p {
      margin-bottom: 15px;
    }

    .card-footer {
      font-family: 'Caveat', cursive;
      font-size: 1.7rem;
      color: #ff9ebb;
      text-align: right;
      margin-top: 20px;
    }

    /* Decoraciones de la tarjeta */
    .corner-rose {
      position: absolute;
      width: 40px;
      height: 40px;
      opacity: 0.6;
    }
    .top-left { top: 15px; left: 15px; }
    .bottom-right { bottom: 15px; right: 15px; transform: rotate(180deg); }
  </style>
</head>
<body>

  <canvas id="petals-canvas"></canvas>

  <div class="container">
    <!-- Pantalla de inicio -->
    <div class="intro-screen" id="intro">
